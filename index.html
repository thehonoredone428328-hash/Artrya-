<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artrya - Shop Anything</title>
<style>
  :root{
    --ink:#10302c; --teal:#0f766e; --sun:#f59e0b; --paper:#f4f7f6;
    --white:#fff; --red:#c2410c; --line:#d6e0dd; --muted:#5b6f6b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Georgia,"Times New Roman",serif;background:var(--paper);color:var(--ink)}
  button,input{font-family:inherit}

  header{background:var(--ink);color:var(--white);padding:12px 16px;position:sticky;top:0;z-index:10}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .logo{font-size:26px;font-weight:bold;letter-spacing:1px}
  .logo span{color:var(--sun)}
  .cart-btn{background:var(--sun);color:var(--ink);border:0;border-radius:6px;
    padding:9px 14px;font-weight:bold;font-size:15px;cursor:pointer}
  .search{margin-top:10px}
  .search input{width:100%;padding:11px 14px;border:0;border-radius:6px;font-size:16px}

  .promo{background:var(--sun);color:var(--ink);text-align:center;
    padding:8px 12px;font-size:14px;font-weight:bold}

  .cats{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;background:var(--white);
    border-bottom:1px solid var(--line)}
  .cats button{white-space:nowrap;border:1px solid var(--line);background:var(--white);
    padding:7px 14px;border-radius:20px;font-size:14px;cursor:pointer;color:var(--ink)}
  .cats button.on{background:var(--teal);color:var(--white);border-color:var(--teal)}

  main{padding:16px;max-width:1100px;margin:auto}
  h2{font-size:20px;margin-bottom:12px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
  .card{background:var(--white);border:1px solid var(--line);border-radius:8px;
    padding:12px;display:flex;flex-direction:column;position:relative}
  .badge{position:absolute;top:8px;left:8px;background:var(--red);color:var(--white);
    font-size:12px;font-weight:bold;padding:3px 7px;border-radius:4px}
  .pic{font-size:64px;text-align:center;padding:18px 0 8px}
  .name{font-size:15px;font-weight:bold;min-height:38px}
  .price{margin-top:6px}
  .now{font-size:18px;font-weight:bold}
  .old{color:var(--muted);text-decoration:line-through;font-size:13px;margin-left:6px}
  .ship{font-size:12px;color:var(--teal);margin:6px 0 10px}
  .add{margin-top:auto;background:var(--teal);color:var(--white);border:0;
    padding:10px;border-radius:6px;font-size:15px;cursor:pointer}
  .empty{padding:30px 0;text-align:center;color:var(--muted)}

  .panel{position:fixed;top:0;right:0;width:100%;max-width:380px;height:100%;
    background:var(--white);box-shadow:-4px 0 20px rgba(0,0,0,.25);
    transform:translateX(100%);transition:transform .25s;z-index:20;
    display:flex;flex-direction:column}
  .panel.open{transform:translateX(0)}
  .panel-head{display:flex;justify-content:space-between;align-items:center;
    padding:16px;background:var(--ink);color:var(--white)}
  .panel-head button{background:none;border:0;color:var(--white);font-size:26px;cursor:pointer}
  .items{flex:1;overflow-y:auto;padding:12px 16px}
  .row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .row .em{font-size:30px}
  .row .info{flex:1;font-size:14px}
  .qty{display:flex;align-items:center;gap:8px}
  .qty button{width:28px;height:28px;border:1px solid var(--line);background:var(--white);
    border-radius:4px;font-size:16px;cursor:pointer}
  .foot{padding:16px;border-top:1px solid var(--line)}
  .total{display:flex;justify-content:space-between;font-size:18px;font-weight:bold;margin-bottom:6px}
  .save{color:var(--teal);font-size:13px;margin-bottom:10px}
  .buy{width:100%;background:var(--sun);color:var(--ink);border:0;padding:13px;
    border-radius:6px;font-size:16px;font-weight:bold;cursor:pointer}

  footer{text-align:center;padding:24px 16px;color:var(--muted);font-size:13px}
</style>
</head>
<body>

<header>
  <div class="top">
    <div class="logo">Art<span>rya</span></div>
    <button class="cart-btn" onclick="toggleCart()">Cart (<span id="count">0</span>)</button>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="Search for products" oninput="render()">
  </div>
</header>

<div class="promo">Delivery within 7 days on every order. Up to 60% off today.</div>

<div class="cats" id="cats"></div>

<main>
  <h2 id="title">All products</h2>
  <div class="grid" id="grid"></div>
</main>

<aside class="panel" id="panel">
  <div class="panel-head">
    <strong>Your cart</strong>
    <button onclick="toggleCart()" aria-label="Close cart">&times;</button>
  </div>
  <div class="items" id="items"></div>
  <div class="foot">
    <div class="total"><span>Total</span><span id="total">₹0</span></div>
    <div class="save" id="save"></div>
    <button class="buy" onclick="checkout()">Place order</button>
  </div>
</aside>

<footer>&copy; 2026 Artrya. Delivery within 7 days.</footer>

<script>
  // Change or add your products here
  // price = selling price, mrp = original price
  const products = [
    {id:1, name:"Wireless Earbuds",     cat:"Electronics", price:1299, mrp:3499, pic:"🎧"},
    {id:2, name:"Smart Watch",          cat:"Electronics", price:1999, mrp:5999, pic:"⌚"},
    {id:3, name:"Power Bank 10000mAh",  cat:"Electronics", price:899,  mrp:1799, pic:"🔋"},
    {id:4, name:"Bluetooth Speaker",    cat:"Electronics", price:1099, mrp:2999, pic:"🔊"},
    {id:5, name:"Men's Cotton T-Shirt", cat:"Fashion",     price:349,  mrp:999,  pic:"👕"},
    {id:6, name:"Running Shoes",        cat:"Fashion",     price:1499, mrp:3999, pic:"👟"},
    {id:7, name:"Backpack",             cat:"Fashion",     price:699,  mrp:1999, pic:"🎒"},
    {id:8, name:"Sunglasses",           cat:"Fashion",     price:399,  mrp:1299, pic:"🕶️"},
    {id:9, name:"Steel Water Bottle",   cat:"Home",        price:299,  mrp:699,  pic:"🍶"},
    {id:10,name:"Table Lamp",           cat:"Home",        price:549,  mrp:1199, pic:"💡"},
    {id:11,name:"Cotton Bedsheet",      cat:"Home",        price:599,  mrp:1599, pic:"🛏️"},
    {id:12,name:"Notebook Set (5)",     cat:"Books",       price:199,  mrp:499,  pic:"📓"}
  ];

  let cart = {};
  let category = "All";

  const inr = n => "₹" + n.toLocaleString("en-IN");
  const off = p => Math.round((p.mrp - p.price) / p.mrp * 100);

  function renderCats(){
    const names = ["All", ...new Set(products.map(p => p.cat))];
    document.getElementById("cats").innerHTML = names.map(c =>
      `<button class="${c===category?'on':''}" onclick="setCat('${c}')">${c}</button>`).join("");
  }

  function setCat(c){ category = c; renderCats(); render(); }

  function render(){
    const q = document.getElementById("q").value.toLowerCase().trim();
    const list = products.filter(p =>
      (category==="All" || p.cat===category) && p.name.toLowerCase().includes(q));
    document.getElementById("title").textContent =
      category==="All" ? "All products" : category;
    document.getElementById("grid").innerHTML = list.length ? list.map(p => `
      <div class="card">
        <div class="badge">${off(p)}% off</div>
        <div class="pic">${p.pic}</div>
        <div class="name">${p.name}</div>
        <div class="price"><span class="now">${inr(p.price)}</span><span class="old">${inr(p.mrp)}</span></div>
        <div class="ship">Delivery within 7 days</div>
        <button class="add" onclick="add(${p.id})">Add to cart</button>
      </div>`).join("") : `<div class="empty">No products found. Try another search.</div>`;
  }

  function add(id){ cart[id] = (cart[id]||0) + 1; update(); }
  function change(id, d){
    cart[id] = (cart[id]||0) + d;
    if(cart[id] <= 0) delete cart[id];
    update();
  }

  function update(){
    let count = 0, total = 0, mrp = 0, html = "";
    for(const id in cart){
      const p = products.find(x => x.id == id), n = cart[id];
      count += n; total += p.price * n; mrp += p.mrp * n;
      html += `
        <div class="row">
          <div class="em">${p.pic}</div>
          <div class="info">${p.name}<br><strong>${inr(p.price)}</strong></div>
          <div class="qty">
            <button onclick="change(${p.id},-1)">-</button>
            <span>${n}</span>
            <button onclick="change(${p.id},1)">+</button>
          </div>
        </div>`;
    }
    document.getElementById("count").textContent = count;
    document.getElementById("items").innerHTML = html || `<div class="empty">Your cart is empty. Add something you like.</div>`;
    document.getElementById("total").textContent = inr(total);
    document.getElementById("save").textContent = count ? `You save ${inr(mrp - total)} on this order` : "";
  }

  function toggleCart(){ document.getElementById("panel").classList.toggle("open"); }

  function checkout(){
    if(!Object.keys(cart).length){ alert("Your cart is empty."); return; }
    alert("Order placed! It will be delivered within 7 days. Thank you for shopping with Artrya.");
    cart = {}; update(); toggleCart();
  }

  renderCats(); render(); update();
</script>
</body>
</html>
